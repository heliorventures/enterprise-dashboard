<div class="pager">
  <p class="range">
    {{ from() }}–{{ to() }} of {{ total() }}
  </p>

  <label class="size">
    Rows
    <select [value]="pageSize()" (change)="onPageSize($event)">
      @for (size of pageSizes; track size) {
        <option [value]="size">{{ size }}</option>
      }
    </select>
  </label>

  <div class="pages">
    <button type="button" class="nav" [disabled]="page() <= 1" (click)="goTo(page() - 1)">Previous</button>
    @for (item of pages(); track $index) {
      @if (item === 'ellipsis') {
        <span class="ellipsis">…</span>
      } @else {
        <button type="button" [class.active]="item === page()" (click)="goTo(item)">{{ item }}</button>
      }
    }
    <button type="button" class="nav" [disabled]="page() >= lastPage()" (click)="goTo(page() + 1)">Next</button>
  </div>
</div>
