<section class="grid-page">
  <app-page-header
    title="Transactions"
    eyebrow="Books of account"
    description="Find the vouchers behind the numbers, by company, date or project."
  />

  @if (error()) {
    <p class="banner" role="alert">{{ error() }}</p>
  }

  <article class="grid-card">
    <div class="grid-toolbar">
      <div>
        <h2><app-icon name="transactions" /> Voucher register</h2>
        <p>
          @if (loading()) {
            Loading voucher count…
          } @else if (!error()) {
            {{ total() }} matching vouchers.
          }
          Zero amounts can mean zero or missing source data; this extract does not distinguish them.
        </p>
      </div>
    </div>

    <app-filter-panel [summary]="filterSummary()">
      <form class="filter-bar filters-6" (submit)="apply($event)">
        <label class="field search">
          <span>Search</span>
          <span class="search-box">
            <app-icon name="search" />
            <input
              type="search"
              [value]="search()"
              (input)="onQuery($event)"
              placeholder="Voucher no, party or narration"
            />
          </span>
        </label>
        <app-company-select
          [companies]="companies()"
          [value]="company()"
          (companyChange)="onCompany($event)"
        />
        <label class="field">
          <span>Type</span>
          <select [value]="type()" (change)="onType($event)">
            <option value="">All types</option>
            @for (name of types(); track name) {
              <option [value]="name">{{ name }}</option>
            }
          </select>
        </label>
        <label class="field">
          <span>From</span>
          <input type="date" [value]="from()" (change)="onFrom($event)" />
        </label>
        <label class="field">
          <span>To</span>
          <input type="date" [value]="to()" (change)="onTo($event)" />
        </label>
        <div class="filter-actions">
          <button type="submit" class="btn ghost" [disabled]="loading()">Search</button>
          <button type="button" class="btn ghost" (click)="clear()">
            <app-icon name="close" />
            Clear
          </button>
          <button
            type="button"
            class="btn primary"
            (click)="exportCsv()"
            [disabled]="exporting() || loading() || !!error()"
          >
            <app-icon name="download" />
            {{ exporting() ? 'Exporting…' : 'Export' }}
          </button>
        </div>
      </form>
    </app-filter-panel>

    <app-data-table
      label="Transactions"
      [rows]="items()"
      [columns]="columns"
      [rowKey]="recordKey"
      [loading]="loading()"
      [error]="error()"
      empty="No transactions match the current filters."
    />
    @if (!loading() && !error()) {
      <app-pager
        [busy]="loading()"
        [total]="total()"
        [page]="page()"
        [pageSize]="pageSize()"
        (pageChange)="onPage($event)"
        (pageSizeChange)="onPageSize($event)"
      />
    }
  </article>
</section>
