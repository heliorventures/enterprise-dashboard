<section class="login">
  <div class="login-card">
    <div class="brand">
      <app-brand-mark />
      <div>
        <strong>Helior Finance</strong>
        <span>Executive console</span>
      </div>
    </div>

    <header>
      <p class="eyebrow">Secure access</p>
      <h1>Sign in</h1>
      <p>Use the dashboard account to view group funds, expenses, and Tally books.</p>
    </header>

    @if (error()) {
      <p class="banner danger" role="alert">{{ error() }}</p>
    }

    @if (auth.failure()) {
      <p class="banner" role="alert">{{ auth.failure() }}</p>
      <button type="button" class="btn primary" (click)="retrySession()" [disabled]="submitting()">
        Retry connection
      </button>
    } @else {
      <form (submit)="$event.preventDefault(); submit()">
        <label class="field">
          <span><app-icon name="user" /> Username</span>
          <input
            name="username"
            autocapitalize="none"
            spellcheck="false"
            autocomplete="username"
            [ngModel]="username"
            (ngModelChange)="username = $event"
            [disabled]="submitting()"
            required
          />
        </label>
        <label class="field">
          <span><app-icon name="lock" /> Password</span>
          <input
            name="password"
            type="password"
            autocomplete="current-password"
            [ngModel]="password"
            (ngModelChange)="password = $event"
            [disabled]="submitting()"
            required
          />
        </label>
        <button
          type="submit"
          class="btn primary"
          [disabled]="submitting() || !username.trim() || !password"
        >
          <app-icon name="signin" />
          {{ submitting() ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>
    }

    <p class="hint">Sessions last 12 hours. Tally remains the system of record.</p>
  </div>
</section>
