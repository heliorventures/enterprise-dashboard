<section class="grid-page">
  <app-page-header
    title="Ledgers"
    eyebrow="Books of account"
    description="Inspect balances and account groups from the latest imported books."
  />

  @if (error()) {
    <p class="banner" role="alert">{{ error() }}</p>
  }

  <article class="grid-card">
    <div class="grid-toolbar">
      <div>
        <h2><app-icon name="ledgers" /> Chart of accounts</h2>
        <p>
          @if (loading()) {
            Loading ledger count…
          } @else if (!error()) {
            {{ total() }} matching ledgers.
          }
          No totals are inferred from a single page.
        </p>
      </div>
      <button
        type="button"
        class="btn primary"
        (click)="exportCsv()"
        [disabled]="exporting() || loading() || !!error()"
      >
        <app-icon name="download" />
        {{ exporting() ? 'Exporting…' : 'Export' }}
      </button>
    </div>

    <app-filter-panel [summary]="filterSummary()">
      <form class="filter-bar filters-4" (submit)="apply($event)">
        <label class="field search">
          <span>Search</span>
          <span class="search-box">
            <app-icon name="search" />
            <input
              type="search"
              [value]="search()"
              (input)="onQuery($event)"
              placeholder="Ledger, group or company"
            />
          </span>
        </label>
        <app-company-select
          [companies]="companies()"
          [value]="company()"
          (companyChange)="onCompany($event)"
        />
        <label class="field">
          <span>Group</span>
          <select [value]="group()" (change)="onGroup($event)">
            <option value="">All groups</option>
            @for (name of groups(); track name) {
              <option [value]="name">{{ name }}</option>
            }
          </select>
        </label>
        <div class="filter-actions">
          <button type="submit" class="btn ghost" [disabled]="loading()">Search</button>
          <button type="button" class="btn ghost" (click)="clear()">
            <app-icon name="close" />
            Clear
          </button>
        </div>
      </form>
    </app-filter-panel>

    <app-data-table
      label="Ledgers"
      [rows]="items()"
      [columns]="columns"
      [rowKey]="recordKey"
      [loading]="loading()"
      [error]="error()"
      empty="No ledgers match the current filters."
    />
    @if (!loading() && !error()) {
      <app-pager
        [busy]="loading()"
        [total]="total()"
        [page]="page()"
        [pageSize]="pageSize()"
        (pageChange)="onPage($event)"
        (pageSizeChange)="onPageSize($event)"
      />
    }
  </article>
</section>
