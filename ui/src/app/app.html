@if (!auth.ready()) {
  <div class="boot">Loading console…</div>
} @else if (auth.user(); as user) {
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="mark" aria-hidden="true">H</span>
        <div>
          <strong>Helior Finance</strong>
          <span>Executive console</span>
        </div>
      </div>

      <nav>
        <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
          <app-icon name="overview" />
          Overview
        </a>
        <a class="nav-link" routerLink="/reports" routerLinkActive="active">
          <app-icon name="reports" />
          Reports
        </a>
        <a class="nav-link" routerLink="/ledgers" routerLinkActive="active">
          <app-icon name="ledgers" />
          Ledgers
        </a>
        <a class="nav-link" routerLink="/transactions" routerLinkActive="active">
          <app-icon name="transactions" />
          Transactions
        </a>
        <a class="nav-link" routerLink="/operations" routerLinkActive="active">
          <app-icon name="operations" />
          Operations
        </a>
        <button type="button" class="nav-link sign-out" (click)="auth.logout()">
          <app-icon name="logout" />
          Sign out
        </button>
      </nav>

      <div class="sidebar-foot">
        <p class="signed-in">Signed in as {{ user.name }}</p>
        <p class="hint">Books come from dumped Tally source records. Each dump is applied incrementally.</p>
      </div>
    </aside>

    <main class="main">
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}
